name: Terraform

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.16.5

jobs:
  format:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List modules
        id: list
        run: |
          modules=$(
            find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
              while read -r module; do
                directory="modules/$module"
                [ -d "examples/$module" ] && directory="examples/$module"
                echo "$module $directory"
              done |
              jq -R 'split(" ") | {module: .[0], directory: .[1]}' |
              jq -s -c .
          )
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - format
      - discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color
